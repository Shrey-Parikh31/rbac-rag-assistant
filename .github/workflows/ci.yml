# The gate.
#
# Five jobs, and the only ones that matter are the ones that can say no. A
# pipeline that runs a scanner and prints its findings is a newsletter. This one
# refuses to publish an image when a case that used to pass stops passing, when
# p95 leaves its budget, or when a critical CVE is present.
#
# Everything on the fast path runs without an API key. Retrieval scoring uses
# the committed vectors, the tests use no model at all, and the container serves
# /search with no credentials. That is what makes it affordable to gate on
# quality per push instead of per release: the free tier allows 20 model
# requests per day per model, so a live evaluation in this workflow would be
# exhausted before lunch. eval/generate.py runs on demand, from eval.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Development tokens, and they are in the repository on purpose: they only
  # exist inside a container this workflow starts and kills. A real deployment
  # takes them from a secret store, which is what client/03-deployment.md says.
  KB_TOKENS: "devstudent:student,devstaff:staff,devadmin:admin"
  # Spelled out rather than ${{ github.repository }}, which carries the owner's
  # capitalisation, and a docker tag must be lowercase.
  IMAGE: ghcr.io/shrey-parikh31/rbac-rag-assistant

jobs:
  # --------------------------------------------------------------- unit + gate
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Plain assert scripts, no test framework. They run in a second and they
      # fail with the line that broke, which is the whole job of a unit test.
      - name: unit tests
        run: |
          python test_rag.py
          python test_tools.py

      - name: http end to end, against a local server
        run: python test_serve.py

      # Chaos experiment 2, kept as a regression test: four broken vector
      # stores, and none of them may start and report healthy.
      - name: a broken index is refused, not served
        run: python reliability/experiments/broken_index.py

      # Chaos experiment 3: the model provider accepts connections and never
      # answers. Bounded wait, bounded concurrency, a breaker that spares the
      # users who come after, and /search untouched throughout.
      - name: a silent model provider costs seconds, not minutes
        env:
          BURST: "30"
        run: python reliability/experiments/slow_provider.py

      # The regression gate. Per case, not per percentage: see the docstring in
      # eval/retrieval.py for why a percentage cannot see a swap.
      - name: retrieval regression gate
        run: python eval/retrieval.py --gate

      # Not a gate. The full table is worth having in the log when the gate
      # fails, so whoever reads it can see what else moved.
      - name: full retrieval report
        if: always()
        run: python eval/retrieval.py

  # ------------------------------------------------------------ static analysis
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install semgrep
      # --error makes a finding fail the job. p/secrets is the rule set that
      # earns its place here: this repository's whole subject is material that
      # must not reach the wrong reader, and a committed key is the shortest
      # path to exactly that.
      - name: semgrep
        run: semgrep --config=p/python --config=p/secrets --error --metrics=off .

  # -------------------------------------------------------------- alerting
  # The alert rules are code, and like code they are tested: promtool runs each
  # rule against synthetic traffic and checks it fires, stays quiet, and clears
  # exactly when reliability/alerts.test.yaml says it should.
  reliability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: alert rules are valid
        run: |
          docker run --rm -v "$PWD/reliability:/r" -w /r --entrypoint promtool \
            prom/prometheus:v3.14.0 check rules alerts.yaml
      - name: alert rules do what they claim
        run: |
          docker run --rm -v "$PWD/reliability:/r" -w /r --entrypoint promtool \
            prom/prometheus:v3.14.0 test rules alerts.test.yaml

  # ---------------------------------------------------- build, scan, load, ship
  image:
    runs-on: ubuntu-24.04
    needs: [quality, static, reliability]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: build
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      # The gate. CRITICAL fails the build; the image does not get published and
      # nothing downstream runs.
      - name: trivy, critical
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true   # a CVE with no patch is not a merge to block on

      # Report only. HIGH findings in a base image are frequently unfixable this
      # week and fixable next week, and a gate that cannot be satisfied is a
      # gate that gets bypassed with a flag.
      - name: trivy, high, reported not enforced
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH
          exit-code: "0"

      - name: start the container
        run: |
          docker run -d --name kb -p 8080:8080 \
            -e KB_TOKENS="$KB_TOKENS" "$IMAGE:${{ github.sha }}"
          for i in $(seq 1 40); do
            if curl -sf localhost:8080/health; then echo; exit 0; fi
            sleep 1
          done
          echo "container never became healthy"; docker logs kb; exit 1

      # The same end-to-end suite the quality job ran against source, now
      # pointed at the artifact that would actually ship. Testing the source and
      # publishing the image tests one thing and releases another.
      # Standard library only, so the runner's own python is enough and the test
      # shares nothing with the container it is testing.
      - name: end to end against the image
        run: python3 test_serve.py http://localhost:8080

      # The latency gate. k6 exits 99 when a threshold is breached, so the
      # budget in perf/latency.js is what blocks the release.
      # Mounted, not piped in on stdin: the script reads questions.json beside
      # itself, and a script arriving on stdin has no beside-itself to read.
      - name: k6 load test with a hard budget
        run: |
          docker run --rm --network host -v "$PWD/perf:/perf:ro" \
            -e BASE=http://localhost:8080 -e TOKEN=devstudent \
            grafana/k6:latest run /perf/latency.js

      - name: container logs
        if: always()
        run: docker logs kb || true

      # ------------------------------------------------------------- cluster
      # A real Kubernetes cluster, built inside this runner, used for two
      # minutes and thrown away. kind and kubectl are both preinstalled, so this
      # costs nothing and installs nothing.
      #
      # It exists to answer the questions a managed cluster would cost $73 a
      # month to answer: does a rolling update work, does a killed pod come
      # back, and does a deployment that cannot start get refused rather than
      # taking the service down with it.
      - name: build a throwaway cluster
        run: |
          docker rm -f kb                        # free port 8080 for the forward
          kind create cluster --name ci --wait 90s
          kind load docker-image --name ci "$IMAGE:${{ github.sha }}"

      - name: deploy
        run: |
          # The token map arrives as a Secret created here rather than as a
          # field in the manifest. Credentials in a file in git is the failure
          # this whole repository is about.
          kubectl create secret generic kb-tokens --from-literal=KB_TOKENS="$KB_TOKENS"
          sed "s|IMAGE_PLACEHOLDER|$IMAGE:${{ github.sha }}|" deploy/k8s.yaml | kubectl apply -f -
          kubectl rollout status deploy/kb --timeout=120s
          kubectl get pods -o wide

      # `kubectl port-forward svc/kb` reads like it goes through the Service and
      # does not: it picks one pod and tunnels straight to it. That makes it
      # fine for driving the test suite from the runner and useless for asking
      # "is the service up", which is the question the rollback step needs --
      # and it answered that question wrongly by surviving a pod deletion once
      # and dying the next time. Anything about the Service is asked from inside
      # the cluster instead, where the Service name actually resolves and
      # actually load balances.
      - name: smoke test through the service
        run: |
          kubectl port-forward svc/kb 8080:80 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          python3 test_serve.py http://localhost:8080
          kill %1

      # Deliberately kill a pod. Kubernetes is supposed to notice and replace
      # it; asserting that it does is the difference between believing the
      # manifest and having watched it work.
      - name: kill a pod and watch it come back
        run: |
          victim=$(kubectl get pods -l app=kb -o name | head -1)
          echo "deleting $victim"
          kubectl delete "$victim" --wait=false
          sleep 2
          kubectl wait --for=condition=ready pod -l app=kb --timeout=90s
          ready=$(kubectl get deploy kb -o jsonpath='{.status.readyReplicas}')
          test "$ready" = "2" || { echo "expected 2 ready replicas, got '$ready'"; exit 1; }
          bash deploy/probe.sh && echo "  still serving through the Service"

      # The rollback. A deployment that cannot possibly start is pushed, and
      # three things have to be true: the rollout is refused, the service keeps
      # answering from the old pods throughout, and undo restores it.
      #
      # The `if kubectl rollout status` inversion is the important line. A
      # rollback test that never sees a failed rollout proves nothing, which is
      # the same vacuous shape as an access test that passes because nothing was
      # retrieved -- and this project has now shipped that mistake sixteen times.
      - name: prove the rollback
        run: |
          kubectl set image deploy/kb kb="$IMAGE:this-tag-does-not-exist"
          if kubectl rollout status deploy/kb --timeout=75s; then
            echo "FAIL: an unstartable image rolled out successfully"; exit 1
          fi
          echo "rollout refused, as it should be"

          # maxUnavailable is 0, so the old pods were never taken away. Asked
          # from inside the cluster, because this is a question about the
          # Service and a port-forward cannot answer it.
          bash deploy/probe.sh || { echo "FAIL: service went down during a failed deploy"; exit 1; }
          echo "service stayed up throughout the failed deploy"

          kubectl rollout undo deploy/kb
          kubectl rollout status deploy/kb --timeout=90s
          kubectl port-forward svc/kb 8080:80 > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/health >/dev/null && break; sleep 1; done
          python3 test_serve.py http://localhost:8080
          kill %1
          echo "rolled back and serving correctly"

      # Experiment 1 from Layer 2: kill a pod while people are using it.
      # The self-healing step above proved a pod comes back. This asks the
      # question a user cares about, which is different: did anybody's request
      # fail while it was coming back?
      - name: chaos, kill a pod under load
        run: |
          kind load docker-image --name ci grafana/k6:latest
          kubectl create configmap perf --from-file=perf/
          kubectl apply -f reliability/chaos-load.yaml
          kubectl wait --for=condition=ready pod -l app=chaos-load --timeout=60s
          sleep 15
          victim=$(kubectl get pods -l app=kb -o name | head -1)
          echo "killing $victim at $(date +%T), 15s into 75s of steady load"
          t0=$(date +%s)
          kubectl delete "$victim" --wait=false
          # How long the pod takes to actually die is half of the result. ~30s
          # means SIGTERM was ignored and SIGKILL did the work.
          kubectl wait --for=delete "$victim" --timeout=90s
          echo "victim took $(( $(date +%s) - t0 ))s to terminate"
          for i in $(seq 1 120); do
            done_=$(kubectl get job chaos-load -o jsonpath='{.status.succeeded}{.status.failed}')
            [ -n "$done_" ] && break; sleep 1
          done
          kubectl logs job/chaos-load | grep -E "http_req_failed|http_reqs|checks_succeeded|checks_failed|✗|✓|ERRO|WARN" | head -20
          # Who actually did the work. Every pod counts its own requests, so
          # an idle replacement beside an overloaded survivor is visible here
          # and nowhere else -- the Service-level totals look fine either way.
          echo "searches served per pod:"
          for p in $(kubectl get pods -l app=kb --field-selector=status.phase=Running -o name); do
            n=$(kubectl exec "$p" -- python -c "import urllib.request; print(next((l.split()[-1] for l in urllib.request.urlopen('http://127.0.0.1:8080/metrics').read().decode().splitlines() if l.startswith('kb_requests_total{route=\"/search\",code=\"200\"}')), 0))")
            age=$(kubectl get "$p" -o jsonpath='{.metadata.creationTimestamp}')
            echo "  $p  created $age  served $n"
          done
          test "$(kubectl get job chaos-load -o jsonpath='{.status.succeeded}')" = "1" \
            || { echo "FAIL: requests failed while a pod was being replaced"; exit 1; }
          echo "no request failed while a pod was killed and replaced"

      # Experiment 4: a token leaks and is revoked by rotating the Secret. How
      # long does the leaked one keep reading documents? Runs last because it
      # changes the tokens every later step would need.
      - name: chaos, revoke a leaked token
        run: bash reliability/experiments/rotate_tokens.sh 150

      - name: what the cluster saw
        if: always()
        run: |
          kubectl get pods -o wide || true
          kubectl describe deploy kb | tail -25 || true
          kubectl logs -l app=kb --tail=20 --all-containers || true

      # Only after every gate above has passed, and only from main. A pull
      # request gets the full verdict and publishes nothing.
      - name: publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  # ------------------------------------------------------------------- deploy
  # Cloud Run, which runs the container only while somebody is asking it
  # something and costs nothing the rest of the time. The kind cluster above
  # proves the orchestration; this is the part with a URL a person can open.
  #
  # Skipped entirely until GCP_PROJECT_ID is set as a repository variable, so
  # the pipeline is green for anyone who clones this without a cloud account.
  # deploy/GOOGLE_CLOUD_SETUP.md is the one-time setup.
  #
  # A skipped job on GitHub shows no reason at all, which read as "deploy is
  # broken" when it was waiting for configuration. This says why, on the run page.
  deploy-waiting:
    runs-on: ubuntu-24.04
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID == ''
    steps:
      - run: |
          msg="Deploy not run: the repository variable GCP_PROJECT_ID is not set yet. Everything else passed and the image is published. Finish deploy/GOOGLE_CLOUD_SETUP.md to go live."
          echo "::notice title=Deploy is waiting for setup::$msg"
          echo "### Deploy is waiting for setup" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    runs-on: ubuntu-24.04
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.GCP_PROJECT_ID != ''
    permissions:
      contents: read
      id-token: write   # the OIDC token that stands in for a stored credential
    steps:
      - uses: actions/checkout@v7

      # No service account key anywhere. GitHub mints a short-lived token that
      # says "this run, from this repository", Google is configured to trust
      # exactly that statement, and nothing long-lived is ever stored. A JSON
      # key in a repository secret is a password with no expiry date that
      # everyone forgets about until it appears in a log.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3

      # Deployed with no traffic at all. The new revision exists, is reachable
      # on its own tagged URL, and is serving nobody.
      #
      # This is better than deploy-then-roll-back, which is what the roadmap
      # asks for: a rollback means production already served the bad version to
      # somebody. Here a broken revision is never in front of a user, so there
      # is nothing to roll back from.
      # Except the very first time. Cloud Run refuses to create a service that
      # serves nobody -- "--no-traffic not supported when creating a new
      # service" -- so the first deploy goes live as it is created. That is
      # acceptable for exactly the reason the candidate flow exists: on the
      # first deploy there is no traffic to protect. Every deploy after it is
      # tested before anyone is moved onto it.
      - name: deploy a candidate revision, no traffic
        run: |
          if gcloud run services describe kb --region us-central1 --format='value(name)' >/dev/null 2>&1; then
            echo "CANDIDATE=1" >> "$GITHUB_ENV"
            EXTRA="--no-traffic --tag candidate"
          else
            echo "CANDIDATE=0" >> "$GITHUB_ENV"
            EXTRA=""
            echo "::notice title=First deploy::The service does not exist yet, so this revision is created live. The smoke test runs against the live URL. Later deploys are tested before receiving traffic."
          fi
          gcloud run deploy kb \
            --image "$IMAGE:${{ github.sha }}" \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            $EXTRA \
            --min-instances 0 --max-instances 1 \
            --memory 512Mi --cpu 1 \
            --service-account "kb-runtime@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets "KB_TOKENS=kb-tokens:latest,GEMINI_API_KEY=gemini-key:latest" \
            --set-env-vars "KB_ASK_DISABLED=1,KB_DEMO_TOKEN=demo-student" \
            --quiet
          # max-instances 1: the student token is public, so the worst case is
          # someone flooding it on purpose, and one instance is the most that
          # can be billed at once. Two million requests a month are free.
          # KB_ASK_DISABLED: the key is for embedding new questions in /search,
          # not for generating answers on a 20-a-day free tier that anyone with
          # the public token could exhaust.

      # The same end-to-end suite, now against a real revision on the internet.
      # KB_TOKENS comes from a GitHub secret because the deployed tokens are not
      # the development ones: this repository is public, and a token anyone can
      # read is not a clearance.
      - name: smoke test the candidate
        env:
          KB_TOKENS: ${{ secrets.KB_TOKENS_DEPLOYED }}
        run: |
          if [ "$CANDIDATE" = "1" ]; then
            url=$(gcloud run services describe kb --region us-central1 \
                    --format='value(status.traffic.filter(tag:candidate).extract(url))' | tr -d "[]'\" ")
            echo "candidate: $url"
          else
            url=$(gcloud run services describe kb --region us-central1 --format='value(status.url)')
            echo "first deploy, live URL: $url"
          fi
          test -n "$url" || { echo "no URL to test"; exit 1; }
          python3 test_serve.py "$url"

      # Only now does anybody see it.
      - name: promote
        run: |
          if [ "$CANDIDATE" = "1" ]; then
            gcloud run services update-traffic kb --region us-central1 --to-latest --quiet
          fi
          url=$(gcloud run services describe kb --region us-central1 --format='value(status.url)')
          echo "live: $url"
          echo "### The assistant is live" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      # The candidate failed its smoke test, so traffic was never moved. Clean
      # up the tag so the next run starts from a known state; production is
      # still serving the previous revision and never knew.
      - name: discard a candidate that failed
        if: failure() && env.CANDIDATE == '1'
        run: |
          gcloud run services update-traffic kb --region us-central1 \
            --remove-tags candidate --quiet || true
          echo "candidate discarded; live traffic never moved"
