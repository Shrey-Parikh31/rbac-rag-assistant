# promtool test rules reliability/alerts.test.yaml
#
# Every claim made in alerts.yaml, tested against synthetic traffic. An alert
# that has never been seen to fire is in the same position as a gate that has
# never been seen to fail, and this project has learned seventeen times what
# that position is worth.
#
# Series notation: 'a+bxn' is a, a+b, ... a+n*b -- one sample per minute.
rule_files:
  - alerts.yaml

evaluation_interval: 1m

tests:
  # --------------------------------------------------------------- healthy
  # 0.1% errors, 0.6% slow, a fifth of searches correctly finding nothing.
  # Nothing may fire. An alert that fires on a healthy service is worse than
  # none, because it teaches people to ignore the next one.
  - name: a healthy service pages nobody
    interval: 1m
    input_series:
      - series: 'kb_requests_total{route="/search",code="200"}'
        values: '0+1000x180'
      - series: 'kb_requests_total{route="/search",code="500"}'
        values: '0+1x180'
      - series: 'kb_request_duration_seconds_bucket{route="/search",le="0.05"}'
        values: '0+995x180'
      - series: 'kb_request_duration_seconds_count{route="/search"}'
        values: '0+1001x180'
      - series: 'kb_search_outcomes_total{outcome="answer"}'
        values: '0+800x180'
      - series: 'kb_search_outcomes_total{outcome="no_match"}'
        values: '0+200x180'
      - series: 'up{job="kb"}'
        values: '1+0x180'
    alert_rule_test:
      - { eval_time: 60m,  alertname: KbAvailabilityBurn, exp_alerts: [] }
      - { eval_time: 180m, alertname: KbAvailabilityBurn, exp_alerts: [] }
      - { eval_time: 180m, alertname: KbLatencyBurn,      exp_alerts: [] }
      - { eval_time: 180m, alertname: KbIndexLooksBroken, exp_alerts: [] }
      - { eval_time: 180m, alertname: KbDown,             exp_alerts: [] }

  # ------------------------------------------------------- a real incident
  # 10% of searches fail for thirty minutes, then stop. Three claims:
  #   at 10m  it pages
  #   at 70m  the page has cleared -- the short windows are clean -- while the
  #           ticket has fired, because the budget that was spent stays spent
  - name: sustained errors page, then the page clears and a ticket remains
    interval: 1m
    input_series:
      - series: 'kb_requests_total{route="/search",code="200"}'
        values: '0+900x90'
      - series: 'kb_requests_total{route="/search",code="500"}'
        values: '0+100x30 3000+0x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: KbAvailabilityBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: Search is failing fast enough to exhaust the monthly error budget within days.
              runbook: reliability/runbooks/availability-burn.md
      - eval_time: 70m
        alertname: KbAvailabilityBurn
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: Search errors are steadily spending the error budget faster than it refills.
              runbook: reliability/runbooks/availability-burn.md

  # ---------------------------------------------------------------- a blip
  # 501 errors in a single minute, in otherwise healthy traffic. At 32m the
  # 5-minute error ratio is about 9% -- a static "page above 5%" rule would wake
  # somebody up. The hour-long window is at about 1.6%, so this does not.
  #
  # This is the whole argument for two windows, as a test that fails if it
  # stops being true.
  - name: a one-minute blip does not page
    interval: 1m
    input_series:
      - series: 'kb_requests_total{route="/search",code="200"}'
        values: '0+1000x90'
      - series: 'kb_requests_total{route="/search",code="500"}'
        values: '0+1x29 530+1x60'
    alert_rule_test:
      - { eval_time: 32m, alertname: KbAvailabilityBurn, exp_alerts: [] }
      - { eval_time: 36m, alertname: KbAvailabilityBurn, exp_alerts: [] }

  # ------------------------------------------------------ nobody answering
  # The failure every ratio above is blind to: no process, no requests
  # counted, no errors counted.
  - name: a dead service pages even though no error was ever recorded
    interval: 1m
    input_series:
      - series: 'up{job="kb"}'
        values: '1+0x10 0+0x20'
      - series: 'kb_requests_total{route="/search",code="200"}'
        values: '0+1000x10 10000+0x20'
    alert_rule_test:
      - { eval_time: 15m, alertname: KbAvailabilityBurn, exp_alerts: [] }
      - eval_time: 15m
        alertname: KbDown
        exp_alerts:
          - exp_labels: { severity: page, job: kb }
            exp_annotations:
              summary: No instance of the assistant is answering scrapes.
              runbook: reliability/runbooks/kb-down.md

  # --------------------------------------------------------------- latency
  - name: a fifth of searches over 50ms pages
    interval: 1m
    input_series:
      - series: 'kb_request_duration_seconds_bucket{route="/search",le="0.05"}'
        values: '0+800x60'
      - series: 'kb_request_duration_seconds_count{route="/search"}'
        values: '0+1000x60'
    alert_rule_test:
      - eval_time: 10m
        alertname: KbLatencyBurn
        exp_alerts:
          - exp_labels: { severity: page }
            exp_annotations:
              summary: Search is slow for enough requests to exhaust the latency budget within days.
              runbook: reliability/runbooks/latency-burn.md

  # ----------------------------------------------------------------- index
  # 90% "no match" at a hundred searches a minute: every request succeeds and
  # nothing is found. The same ratio at one search a minute is three unlucky
  # questions, not a broken index, and must not file a ticket.
  - name: an index that finds nothing is noticed, but only with real traffic
    interval: 1m
    input_series:
      - series: 'kb_search_outcomes_total{outcome="answer",env="busy"}'
        values: '0+10x60'
      - series: 'kb_search_outcomes_total{outcome="no_match",env="busy"}'
        values: '0+90x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: KbIndexLooksBroken
        exp_alerts:
          - exp_labels: { severity: ticket }
            exp_annotations:
              summary: Most searches are finding nothing, while returning success.
              runbook: reliability/runbooks/index-broken.md

  - name: a quiet hour of misses is not a broken index
    interval: 1m
    input_series:
      - series: 'kb_search_outcomes_total{outcome="no_match"}'
        values: '0+1x60'
    alert_rule_test:
      - { eval_time: 30m, alertname: KbIndexLooksBroken, exp_alerts: [] }
